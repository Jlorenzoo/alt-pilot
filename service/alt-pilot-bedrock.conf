[Service]
# Native WebRTC needs extra room while Geyser sends the world snapshot.
# The shared alt-pilot.slice still caps combined client memory on each VM.
MemoryHigh=512M
MemoryMax=640M
Environment=MALLOC_ARENA_MAX=2
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK

# Keep genuine transport failures from adding 30 seconds of idle time per retry.
RestartSec=5
TimeoutStopSec=5
