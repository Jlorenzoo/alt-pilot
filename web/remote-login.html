<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18191b">
  <title>Sign in · ALT Pilot</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="stylesheet" href="/login.css?v=20261029polish3">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand"><img class="login-mark" src="/icon.svg" width="34" height="34" alt=""><span><strong>ALT Pilot</strong><small>Minecraft client control</small></span></div>
      <div class="login-copy"><p class="eyebrow">Private access</p><h1>Welcome back</h1><p>Enter the control password to manage your Minecraft client.</p></div>
      <form method="post" action="/login">
        <label for="password">Control password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
        <p class="login-error">{{ERROR}}</p>
        <button type="submit"><svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9-14H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg><span>Sign in</span></button>
      </form>
      <footer><span class="lock">◆</span> HTTPS tunnel · 30-day persistent session</footer>
    </section>
  </main>
</body>
</html>
